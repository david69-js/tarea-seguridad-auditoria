# =====================================================================
#  Entorno de desarrollo local (equivalente a Railway):
#    - web:         aplicación PHP + Apache (Dockerfile)
#    - db:          MySQL 8, carga automáticamente database/pos_tienda.sql
#    - phpmyadmin:  administrador web de la base de datos
#
#  Uso:         docker compose up --build
#  App:         http://localhost:8091
#  phpMyAdmin:  http://localhost:8083  (usuario: root / clave: root)
#  MySQL:       localhost:3309 desde su maquina
#
#  En "puerto_maquina:puerto_contenedor" solo se cambia el de la izquierda:
#  dentro de los contenedores MySQL escucha en 3306 y Apache en 80.
# =====================================================================
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pos_tienda
    ports:
      - "3309:3306"
    volumes:
      - ./database/pos_tienda.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: pos_tienda
      DB_USER: root
      DB_PASSWORD: root
      # Clima del dashboard (API externa OpenWeatherMap). Se toma del entorno
      # o de un .env junto a este archivo; si falta, el dashboard lo indica
      # y el resto del sistema funciona igual.
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      OPENWEATHER_CIUDAD: ${OPENWEATHER_CIUDAD:-Guatemala City,GT}
    ports:
      - "8091:80"

  phpmyadmin:
    image: phpmyadmin:5
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      UPLOAD_LIMIT: 64M
    ports:
      - "8083:80"

volumes:
  db_data:
