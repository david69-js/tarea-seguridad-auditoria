# =====================================================================
#  Entorno de desarrollo local (equivalente a Railway):
#    - web:         aplicación PHP + Apache (Dockerfile)
#    - db:          MySQL 8, carga automáticamente database/pos_libreria.sql
#    - phpmyadmin:  administrador web de la base de datos
#
#  Uso:         docker compose up --build
#  App:         http://localhost:8090
#  phpMyAdmin:  http://localhost:8081  (usuario: root / clave: root)
# =====================================================================
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pos_libreria
    ports:
      - "3307:3309"
    volumes:
      - ./database/pos_libreria.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3309"
      DB_NAME: pos_libreria
      DB_USER: root
      DB_PASSWORD: root
      # Clima del dashboard (API externa OpenWeatherMap). Se toma del entorno
      # o de un .env junto a este archivo; si falta, el dashboard lo indica
      # y el resto del sistema funciona igual.
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      OPENWEATHER_CIUDAD: ${OPENWEATHER_CIUDAD:-Guatemala City,GT}
    ports:
      - "8091:81"

  phpmyadmin:
    image: phpmyadmin:5
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: "3309"
      UPLOAD_LIMIT: 64M
    ports:
      - "8083:83"

volumes:
  db_data:
